<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TWENTY — Reserva</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
}

.contenedor {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 45px 25px 60px;
}

/* LOGO */

.logo {
    text-align: center;
    font-size: 25px;
    letter-spacing: 6px;
    font-weight: 600;
    margin-bottom: 55px;
}

/* TITULO */

.titulo {
    text-align: center;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 35px;
}

/* PRODUCTO */

.producto {
    text-align: center;
    margin-bottom: 40px;
}

.imagen-producto {
    width: 260px;
    height: 330px;
    object-fit: contain;
    display: block;
    margin: auto;
}

.nombre-producto {
    font-size: 17px;
    margin-top: 15px;
    margin-bottom: 8px;
}

.precio {
    font-size: 16px;
    font-weight: 600;
}

/* FORMULARIO */

.formulario {
    border-top: 1px solid #dddddd;
    padding-top: 30px;
}

.campo {
    margin-bottom: 22px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
    margin-bottom: 8px;
}

input,
select {
    width: 100%;
    height: 48px;
    border: 1px solid #cccccc;
    background: white;
    padding: 0 14px;
    font-size: 14px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #111111;
}

/* BOTON */

.boton {
    width: 100%;
    height: 52px;
    border: none;
    background: #111111;
    color: white;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    margin-top: 8px;
}

.boton:hover {
    background: #333333;
}

/* CARGANDO */

.cargando {
    display: none;
    text-align: center;
    margin-top: 28px;
}

/* RUEDITA */

.ruedita {
    width: 32px;
    height: 32px;
    border: 3px solid #dddddd;
    border-top: 3px solid #111111;
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
    margin: auto;
}

@keyframes girar {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

/* MENSAJE FINAL */

.exito {
    display: none;
    text-align: center;
    padding: 35px 20px;
    border: 1px solid #dddddd;
    margin-top: 30px;
}

.exito h2 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 12px;
}

.exito p {
    color: #666666;
    font-size: 14px;
    line-height: 1.5;
}

/* CELULAR */

@media (max-width: 600px) {

    .contenedor {
        padding: 30px 20px 50px;
    }

    .logo {
        margin-bottom: 45px;
    }

    .titulo {
        font-size: 24px;
    }

    .imagen-producto {
        width: 230px;
        height: 290px;
    }

}

</style>
</head>


<body>

<div class="contenedor">

    <div class="logo">
        TWENTY
    </div>


    <h1 class="titulo">
        FINALIZA TU RESERVA
    </h1>


    <!-- PRODUCTO -->

    <div class="producto">

        <img
            id="imagenProducto"
            class="imagen-producto"
            src="https://i.ibb.co/gZrPB788/TMW-0285.webp"
            alt="Prenda"
        >

        <div
            id="nombreProducto"
            class="nombre-producto">
            POLO HIGH COTON
        </div>

        <div
            id="precioProducto"
            class="precio">
            $ 40.00
        </div>

    </div>


    <!-- FORMULARIO -->

    <div class="formulario">

        <div class="campo">

            <label>
                NOMBRE
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ingresa tu nombre"
            >

        </div>


        <div class="campo">

            <label>
                TELÉFONO
            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ingresa tu teléfono"
            >

        </div>


        <div class="campo">

            <label>
                TALLA
            </label>

            <select id="talla">

                <option value="">
                    Seleccionar talla
                </option>

                <option value="S">
                    S
                </option>

                <option value="M">
                    M
                </option>

                <option value="L">
                    L
                </option>

                <option value="XL">
                    XL
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                FECHA DE RESERVA
            </label>

            <input
                type="date"
                id="fecha"
            >

        </div>


        <button
            class="boton"
            onclick="reservar()">

            RESERVAR

        </button>


        <!-- CARGANDO -->

        <div
            class="cargando"
            id="cargando">

            <div class="ruedita"></div>

        </div>


        <!-- MENSAJE FINAL -->

        <div
            class="exito"
            id="exito">

            <h2>
                TU RESERVA HA SIDO COMPLETADA
            </h2>

            <p>
                Hemos recibido correctamente los datos de tu reserva.
            </p>

        </div>

    </div>

</div>


<script>

/* PRODUCTOS */

const productos = {

    "22": {

        nombre: "POLO HIGH COTON",

        precio: "$ 40.00",

        imagen: "https://i.ibb.co/gZrPB788/TMW-0285.webp"

    }

};


/* LEER PRODUCTO DE LA URL */

const parametros = new URLSearchParams(
    window.location.search
);

const productoId = parametros.get("producto");


/* MOSTRAR PRODUCTO */

if (productoId && productos[productoId]) {

    document.getElementById("nombreProducto").textContent =
        productos[productoId].nombre;

    document.getElementById("precioProducto").textContent =
        productos[productoId].precio;

    document.getElementById("imagenProducto").src =
        productos[productoId].imagen;

}


/* RESERVAR */

function reservar() {

    const nombre =
        document.getElementById("nombre").value.trim();

    const telefono =
        document.getElementById("telefono").value.trim();

    const talla =
        document.getElementById("talla").value;

    const fecha =
        document.getElementById("fecha").value;


    /* COMPROBAR CAMPOS */

    if (
        !nombre ||
        !telefono ||
        !talla ||
        !fecha
    ) {

        alert("Completa todos los datos para continuar.");

        return;

    }


    /* OCULTAR BOTON */

    document.querySelector(".boton").style.display =
        "none";


    /* MOSTRAR CARGANDO */

    document.getElementById("cargando").style.display =
        "block";


    /* SIMULAR PROCESAMIENTO */

    setTimeout(function() {

        document.getElementById("cargando").style.display =
            "none";

        document.getElementById("exito").style.display =
            "block";

    }, 1800);

}

</script>

</body>
</html>
