<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TWENTY — Reserva</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#ffffff;
    font-family:'Montserrat',sans-serif;
    color:#111;
}

.container{
    max-width:760px;
    margin:auto;
    padding:55px 25px;
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:500;
    letter-spacing:5px;
    margin-bottom:45px;
}

h1{
    text-align:center;
    font-size:22px;
    font-weight:500;
    letter-spacing:2px;
    margin-bottom:45px;
}

.producto{
    text-align:center;
    margin-bottom:45px;
}

.producto img{
    width:180px;
    height:220px;
    object-fit:contain;
    background:#f3f3f3;
    margin-bottom:20px;
}

.producto h2{
    font-size:17px;
    font-weight:500;
    margin:8px 0;
}

.precio{
    font-size:16px;
    font-weight:400;
}

.formulario{
    display:flex;
    flex-direction:column;
    gap:18px;
}

label{
    font-size:12px;
    letter-spacing:1px;
    font-weight:500;
}

input,
select{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    font-family:'Montserrat',sans-serif;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#111;
}

.tallas{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:8px;
}

.talla{
    width:55px;
    height:45px;
    border:1px solid #ccc;
    background:#fff;
    cursor:pointer;
    font-family:'Montserrat',sans-serif;
    transition:.2s;
}

.talla:hover{
    border-color:#111;
}

.talla.selected{
    background:#111;
    color:#fff;
    border-color:#111;
}

button.reservar{
    margin-top:15px;
    width:100%;
    padding:16px;
    background:#111;
    color:#fff;
    border:none;
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
}

button.reservar:hover{
    opacity:.9;
}

.spinner{
    display:none;
    width:22px;
    height:22px;
    border:3px solid #ddd;
    border-top:3px solid #111;
    border-radius:50%;
    animation:girar .8s linear infinite;
    margin:20px auto;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

.success{
    display:none;
    text-align:center;
    margin-top:25px;
    font-size:14px;
    letter-spacing:1px;
}

.error{
    text-align:center;
    font-size:14px;
    margin-top:30px;
}

@media(max-width:700px){

    .container{
        padding:40px 20px;
    }

    .producto img{
        width:160px;
        height:200px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        TWENTY
    </div>

    <h1>
        FINALIZA TU RESERVA
    </h1>

    <div id="producto" class="producto">
        <img id="imagenProducto" src="" alt="Producto">
        <h2 id="nombreProducto"></h2>
        <div id="precioProducto" class="precio"></div>
    </div>

    <div id="productoNoEncontrado" class="error" style="display:none;">
        PRODUCTO NO ENCONTRADO
    </div>

    <form id="formulario" class="formulario" style="display:none;">

        <div>
            <label>NOMBRE</label>
            <input type="text" id="nombre" required>
        </div>

        <div>
            <label>TELÉFONO</label>
            <input type="tel" id="telefono" required>
        </div>

        <div>
            <label>CORREO ELECTRÓNICO</label>
            <input type="email" id="correo" required>
        </div>

        <div>
            <label>TALLA</label>

            <div id="tallas" class="tallas"></div>
        </div>

        <div>
            <label>FECHA DE RESERVA</label>
            <input type="date" id="fecha" required>
        </div>

        <button type="submit" class="reservar">
            RESERVAR
        </button>

    </form>

    <div id="spinner" class="spinner"></div>

    <div id="success" class="success">
        RESERVA FINALIZADA
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({
    publicKey: "FdHYCIvlgbsKGhjYB"
});


const productos = {

    "polo-boxy": {
        nombre: "POLO BOXY FIT CON CUELLO CAMISERO",
        precio: "$ 65.00",
        imagen: "https://i.ibb.co/3yv0T9cf/NUEVA-PRENDA-1.png",
        tallas: ["S","M","L","XL"]
    },

    "pantalon-baggy": {
        nombre: "PANTALON BAGGY GRIS",
        precio: "$ 85.00",
        imagen: "https://i.ibb.co/B58NZ45W/NUEVA-PRENDA-2.png",
        tallas: ["28","30","32","34"]
    },

    "zip-hoodie": {
        nombre: "ZIP HOODIE NEGRO",
        precio: "$ 80.00",
        imagen: "https://i.ibb.co/cSd3FRYK/NUEVA-PRENDA-3.png",
        tallas: ["S","M","L","XL"]
    },

    "polo-cuello-camisero": {
        nombre: "POLO CUELLO CAMISERO",
        precio: "$ 60.00",
        imagen: "https://i.ibb.co/nNfFFHzf/NUEVA-PRENDA-4.png",
        tallas: ["S","M","L","XL"]
    },

    "polo-estilo-futbol": {
        nombre: "POLO ESTILO FUTBOL",
        precio: "$ 45.00",
        imagen: "https://i.ibb.co/9mtnwBWM/NUEVA-PRENDA-5.png",
        tallas: ["S","M","L","XL"]
    },

    "jacket-blanco-polar": {
        nombre: "JACKET BLANCO POLAR",
        precio: "$ 90.00",
        imagen: "https://i.ibb.co/vCGYqhgt/NUEVA-PRENDA-6.png",
        tallas: ["S","M","L","XL"]
    }

};


const parametros = new URLSearchParams(window.location.search);

const productoID = parametros.get("producto");

const producto = productos[productoID];


if(producto){

    document.getElementById("imagenProducto").src = producto.imagen;

    document.getElementById("nombreProducto").textContent = producto.nombre;

    document.getElementById("precioProducto").textContent = producto.precio;

    const contenedorTallas = document.getElementById("tallas");

    producto.tallas.forEach(talla => {

        const boton = document.createElement("button");

        boton.type = "button";

        boton.className = "talla";

        boton.textContent = talla;

        boton.addEventListener("click", function(){

            document.querySelectorAll(".talla").forEach(b => {
                b.classList.remove("selected");
            });

            boton.classList.add("selected");

            boton.dataset.selected = "true";

        });

        contenedorTallas.appendChild(boton);

    });

    document.getElementById("formulario").style.display = "flex";

}else{

    document.getElementById("producto").style.display = "none";

    document.getElementById("productoNoEncontrado").style.display = "block";

}


document.getElementById("formulario").addEventListener("submit", function(e){

    e.preventDefault();

    const nombre = document.getElementById("nombre").value.trim();

    const telefono = document.getElementById("telefono").value.trim();

    const correo = document.getElementById("correo").value.trim();

    const fecha = document.getElementById("fecha").value;

    const tallaSeleccionada = document.querySelector(".talla.selected");


    if(!tallaSeleccionada){

        alert("SELECCIONA UNA TALLA");

        return;

    }


    if(!nombre || !telefono || !correo || !fecha){

        alert("COMPLETA TODOS LOS CAMPOS");

        return;

    }


    const spinner = document.getElementById("spinner");

    const boton = document.querySelector(".reservar");


    boton.style.display = "none";

    spinner.style.display = "block";


    const datos = {

        name: nombre,

        phone: telefono,

        email: correo,

        product: producto.nombre,

        price: producto.precio,

        size: tallaSeleccionada.textContent,

        date: fecha,

        image: producto.imagen

    };


    emailjs.send(
        "service_28u43ts",
        "template_stktgzu",
        datos
    )

    .then(function(){

        spinner.style.display = "none";

        document.getElementById("formulario").style.display = "none";

        document.getElementById("success").style.display = "block";

    })

    .catch(function(error){

        console.error(error);

        spinner.style.display = "none";

        boton.style.display = "block";

        alert("OCURRIÓ UN ERROR AL REALIZAR LA RESERVA");

    });

});

</script>

</body>
</html>
